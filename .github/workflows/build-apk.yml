name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      # debug.keystore is committed at the repo root (see .gitignore) specifically so
      # every build signs with the SAME certificate. It was accidentally deleted by an
      # earlier commit, which is why this step went back to generating (and copying to
      # ~/.android) a brand-new random keystore on every single run -- every build then
      # carried a different signature, so installing a newer debug APK over an older one
      # failed with Android's "App not installed as package conflicts with existing
      # package". Only generate a fallback here if the committed file is ever missing
      # again, and copy it into ~/.android too so both locations agree.
      - name: Verify Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore missing from repo -- generating a fallback (builds signed this way will NOT match prior installs)."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep SHA256
          fi
          cp debug.keystore ~/.android/debug.keystore

      # versionCode was hardcoded, which independently blocks Android from treating a
      # newer APK as an upgrade over an older one (a same-or-lower versionCode is
      # rejected on install even with a matching signature). The Actions run number
      # strictly increases across builds, so it's a safe, deterministic versionCode for
      # CI-built APKs; local/Studio builds fall back to the hardcoded default, unchanged.
      - name: Build Debug APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Artify-Workforce-App
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
