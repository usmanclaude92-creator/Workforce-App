name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      # debug.keystore is committed at the repo root so every build shares the same
      # signing certificate -- a fresh keytool-generated keystore on every run made each
      # CI-built APK conflict with the last on install ("App not installed as package
      # conflicts with existing package"), since Android rejects installing/upgrading an
      # APK over an existing install of the same applicationId signed with a different
      # certificate. Only regenerate as a fallback if the committed file is ever missing.
      - name: Verify Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore missing from repo -- generating a fallback (builds signed this way will NOT match prior installs)."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep SHA256
          fi

      # versionCode was hardcoded at 1 forever, which independently blocks Android from
      # treating a newer APK as an upgrade over an older one (even with a matching
      # signature). The run number strictly increases across builds, so it's a safe,
      # deterministic versionCode for CI-built APKs; local/Studio builds are unaffected
      # (defaultConfig's own hardcoded fallback still applies when this var isn't set).
      - name: Build Debug APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Prints the SIGNING CERTIFICATE ACTUALLY EMBEDDED IN THE BUILT APK, independent of
      # the debug.keystore file check above -- confirms the Gradle signing config really
      # applied to this output (not just that the keystore file on disk is the right one).
      # Must match the fingerprint the "Verify Debug Keystore" step prints.
      #
      # Uses apksigner, not keytool -printcert: this APK carries only the modern APK
      # Signature Scheme v2/v3 block, which keytool cannot read at all (it only
      # understands the legacy v1/JAR META-INF signature) -- keytool failed outright with
      # no usable output the one time this was tried. continue-on-error so a problem in
      # this purely informational check can never again block the Upload APK step below
      # (as it did here: this step's earlier failure skipped the upload entirely).
      - name: Verify Built APK Signature
        continue-on-error: true
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          echo "Inspecting: $apk"
          apksigner="$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner not found under ANDROID_HOME -- skipping signature verification."
          else
            "$apksigner" verify --print-certs "$apk"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Artify-Workforce-App
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
